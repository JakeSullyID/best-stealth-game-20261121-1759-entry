<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW VAULT</title>
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            border: 2px solid #1f2833;
            background: #0b0c10;
        }
        canvas {
            display: block;
            width: 1280px;
            height: 720px;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="status" class="sr-only" aria-live="polite">SHADOW VAULT loaded. Press Enter to start heist.</div>
        <canvas id="game" width="1280" height="720"></canvas>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
